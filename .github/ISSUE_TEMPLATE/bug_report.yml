name: Bug report
description: Something doesn't work the way the README says it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Steps to reproduce, what you expected and what you saw instead.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Release, commit or package version you're using.
  - type: textarea
    id: context
    attributes:
      label: Anything else
      description: Logs, screenshots, OS or browser. More context makes the fix faster.
